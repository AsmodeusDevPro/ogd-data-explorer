name: Restrict Merge to Main

on:
  pull_request:
    branches:
      - main

jobs:
  check-merge-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check if source branch is 'integration'
        run: |
          echo "Source branch: ${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" != "integration" ]]; then
            echo "❌ Only 'integration' branch can merge into 'main'."
            exit 1
          else
            echo "✅ Merge from 'integration' branch allowed."
          fi
